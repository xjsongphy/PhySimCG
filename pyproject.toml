[project]
name = "physimcg"
version = "0.1.0"
description = "Physics Simulation for Computer Graphics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "taichi>=1.7",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
lab2 = "lab2.__main__:main"

[tool.setuptools.packages.find]
include = ["lab2*"]
